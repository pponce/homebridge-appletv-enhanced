name: Build

on:
  push:
    branches:
      - main
      - fix/appletv18-discovery
  pull_request:
    paths:
      - "**.ts"
      - "**.js"
      - "**.json"
      - "**.mjs"
      - "**.mts"
      - "**.html"
      - ".npmignore"
      - ".nvmrc"
  workflow_dispatch:

jobs:
  node-versions-from-package:
    name: extract node versions from package.json

    runs-on: ubuntu-latest

    outputs:
      versions: ${{ steps.load-versions.outputs.versions }}

    steps:
      - name: Checkout package.json
        uses: actions/checkout@v7
        with:
          sparse-checkout: package.json

      - name: Extract Node versions
        id: load-versions
        shell: bash
        run: |
          # read .engines.node attribute from package.json
          version_str=$(jq ".engines.node" package.json --raw-output)

          # split the version string into individual versions
          IFS=' || ' read -r -a versions <<< "$version_str"

          # filter empty elements
          filtered_versions=()
          for v in "${versions[@]}"; do
            if [ -n "$v" ]; then
              filtered_versions+=("$v")
            fi
          done

          # remove "^" from filtered_versions
          clean_versions=()
          for v in "${filtered_versions[@]}"; do
            clean_version="${v:1}"
            clean_versions+=("$clean_version")
          done

          # merge versions together
          version_list_as_str=""
          for v in "${clean_versions[@]}"; do
            if [ -n "$version_list_as_str" ]; then
              version_list_as_str+=", "
            fi
            version_list_as_str+="\""
            version_list_as_str+="$v"
            version_list_as_str+="\""
          done

          result="versions={\"list\": [$version_list_as_str]}"
          echo $result

          echo $result >> $GITHUB_OUTPUT

  build:
    name: ubuntu-latest Node ${{ matrix.node }} Build
    needs: node-versions-from-package

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(needs.node-versions-from-package.outputs.versions).list }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js environment
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install and build
        shell: bash
        run: npm ci --no-audit --no-fund

      - name: Test device discovery
        shell: bash
        run: npm test

      - name: Verify installable package
        shell: bash
        run: |
          npm pack --ignore-scripts --dry-run --json > package-contents.json
          node <<'JS'
          const assert = require('node:assert/strict');
          const files = new Set(require('./package-contents.json')[0].files.map(file => file.path));
          for (const file of ['dist/index.js', 'dist/deviceSupport.js', 'dist/html/input.html',
            'dist/html/afterPost.html', 'dist/html/backOff.html', 'config.schema.json', 'requirements.txt']) {
            assert(files.has(file), `Missing package file: ${file}`);
          }
          const { isSupportedAppleTV } = require('./dist/deviceSupport');
          assert(isSupportedAppleTV({ model: 'Unknown', modelName: 'AppleTV18,1', os: 'Unknown' }));
          JS

